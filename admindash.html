<!DOCTYPE html>
<html>
<head>
<title>Mess Admin Dashboard</title>
<style>
body {
    font-family: Arial;
    background:#f4f6f8;
    padding:30px;
}
.box {
    background:white;
    padding:20px;
    border-radius:10px;
}
button {
    padding:10px;
    background:#1e90ff;
    color:white;
    border:none;
    border-radius:6px;
}
</style>
</head>

<body>

<h2>👨‍🍳 Mess Admin Panel</h2>

<button onclick="logout()">Logout</button>

<div class="box">
    <p>📌 Verify QR:</p>
    <ul>
        <li>✔ Date should be today</li>
        <li>✔ Snack → once per day</li>
        <li>✔ Egg → allowed daily</li>
    </ul>
</div>

<script>
if(localStorage.getItem("role") !== "admin")
    location.href = "login.html";

function logout(){
    localStorage.clear();
    window.location.href = "login.html";
}
</script>

</body>
</html>
