<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hostel Attendance Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
}

header {
    background: #1e90ff;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 22px;
}

.container {
    padding: 20px;
}

.welcome {
    font-size: 20px;
}
</style>
</head>

<body>

<header>
    🏨 Hostel Attendance System
</header>

<div class="container">
    <div class="welcome">
        Welcome, <b id="username"></b> 👋
    </div>
</div>

<script>
    // Read PLF number
    const plfno = localStorage.getItem("plfno");

    // Safety check
    if (!plfno) {
        window.location.href = "login.html";
    }

    // Show welcome message
    document.getElementById("username").innerText = "PLF No: " + plfno;
</script>

</body>
</html>
