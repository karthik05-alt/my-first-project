<!DOCTYPE html>
<html>
<head>
<title>Student Dashboard</title>
<style>
body {
    font-family: Arial;
    background:#f4f6f8;
    padding:20px;
}
.card {
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:10px;
}
button {
    padding:10px;
    background:#1e90ff;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<h2>👋 Welcome Student</h2>
<p>PLF No: <b id="sid"></b></p>

<button onclick="logout()">Logout</button>

<div class="card">
    <h3>🍪 Snack Token (Once Per Day)</h3>
    <button onclick="generateQR('snack')">Generate Snack QR</button>
</div>

<div class="card">
    <h3>🥚 Egg Token (Daily)</h3>
    <button onclick="generateQR('egg')">Generate Egg QR</button>
</div>

<script>
if(localStorage.getItem("role") !== "student")
    location.href = "login.html";

document.getElementById("sid").innerText =
    localStorage.getItem("userid");

function generateQR(type){
    let today = new Date().toLocaleDateString();
    let lastSnackDate = localStorage.getItem("snackDate");

    if(type === "snack"){
        if(lastSnackDate === today){
            alert("❌ Snack already taken today");
            return;
        }
        localStorage.setItem("snackDate", today);
    }

    localStorage.setItem("tokenType", type);
    window.location.href = "qr.html";
}

function logout(){
    localStorage.clear();
    window.location.href = "index.html";
}
</script>

</body>
</html>
