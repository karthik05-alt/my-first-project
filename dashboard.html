<!DOCTYPE html>
<html>
<head>
<title>Student Dashboard</title>
<style>
body { font-family: Arial; background:#f4f6f8; padding:20px; }
.card {
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:10px;
}
button {
    padding:10px;
    background:#1e90ff;
    color:white;
    border:none;
    border-radius:6px;
}
</style>
</head>

<body>

<h2>👋 Welcome Student</h2>
<p>PLF No: <b id="sid"></b></p>

<div class="card">
    <h3>🍪 Snack Token (Today Only)</h3>
    <button onclick="generateQR('snack')">Generate QR</button>
</div>

<div class="card">
    <h3>🥚 Egg Token (Daily)</h3>
    <button onclick="generateQR('egg')">Generate QR</button>
</div>

<script>
let role = localStorage.getItem("role");
if(role !== "student") location.href="login.html";

document.getElementById("sid").innerText =
    localStorage.getItem("userid");

function generateQR(type){
    localStorage.setItem("tokenType", type);
    window.location.href="qr.html";
}
</script>

</body>
</html>
