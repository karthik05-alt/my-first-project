<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hostel Attendance Login</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg, #1e90ff, #00b894);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: white;
    padding: 30px;
    width: 350px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
}

.login-box h2 {
    margin-bottom: 15px;
}

.login-box input {
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.login-box button {
    width: 100%;
    padding: 12px;
    background: #1e90ff;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>🏨 Hostel Attendance</h2>

    <!-- PLF Number -->
    <input type="text" id="plfno" placeholder="PLF Number">

    <!-- Date of Birth -->
    <input type="date" id="dob">

    <button onclick="login()">Login</button>
</div>

<script>
function login() {
    const plfno = document.getElementById("plfno").value;
    const dob = document.getElementById("dob").value;

    // Demo credentials
    if (plfno === "24C247" && dob === "2006-09-05") {

        // Store PLF number
        localStorage.setItem("plfno", plfno);

        // Redirect to dashboard
        window.location.href = "dashboard.html";
    } else {
        alert("Invalid PLF Number or Date of Birth ❌");
    }
}
</script>

</body>
</html>
