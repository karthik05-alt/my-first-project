<!DOCTYPE html>
<html>
<head>
<title>Hostel Token Login</title>
<style>
body {
    font-family: Arial;
    background: linear-gradient(120deg,#1e90ff,#00b894);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.box {
    background:white;
    padding:30px;
    width:320px;
    border-radius:12px;
    text-align:center;
}
input,select,button {
    width:100%;
    padding:12px;
    margin:10px 0;
}
button {
    background:#1e90ff;
    color:white;
    border:none;
    border-radius:6px;
}
</style>
</head>

<body>
<div class="box">
    <h2>🏨 Hostel Login</h2>

    <select id="role">
        <option value="student">Student</option>
        <option value="admin">Mess Admin</option>
    </select>

    <input type="text" id="userid" placeholder="Enter ID">

    <button onclick="login()">Login</button>
</div>

<script>
function login() {
    let role = document.getElementById("role").value;
    let id = document.getElementById("userid").value;

    if(id === "") {
        alert("Enter ID");
        return;
    }

    localStorage.setItem("role", role);
    localStorage.setItem("userid", id);

    if(role === "student")
        window.location.href = "student-dashboard.html";
    else
        window.location.href = "admin-dashboard.html";
}
</script>
</body>
</html>
