<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hostel Attendance Login</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg, #1e90ff, #00b894);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: white;
    padding: 30px;
    width: 350px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
}

.login-box h2 {
    margin-bottom: 15px;
}

.login-box input {
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.login-box button {
    width: 100%;
    padding: 12px;
    background: #1e90ff;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>🏨 Hostel Attendance</h2>

    <!-- Display only -->
    <input type="text" placeholder="PLF Number">
    <input type="text" placeholder="Date of Birth (YYYY-MM-DD)">

    <button onclick="login()">Login</button>
</div>

<script>
function login() {
    // Fixed values
    const plfno = "24C247";
    const dob = "2006-09-05";

    // Store in browser
    localStorage.setItem("plfno", plfno);
    localStorage.setItem("dob", dob);

    // Redirect to dashboard
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
