<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hostel Attendance Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #1e90ff, #00b894);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 10px;
            color: #333;
        }

        .login-box p {
            color: #666;
            font-size: 14px;
        }

        .login-box input, .login-box select {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #1e90ff;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #187bcd;
        }

        .footer-text {
            margin-top: 15px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>🏨 Hostel Attendance</h2>
    <p>Please login to continue</p>

    <select>
        <option>Student</option>
        <option>Warden</option>
        <option>Admin</option>
    </select>

    <input type="text" placeholder="Register Number / Username">
    <input type="password" placeholder="Password">

    <button>Login</button>

    <div class="footer-text">
        © 2026 Hostel Management System
    </div>
</div>

</body>
</html>
